services:
  db:
    image: postgres:15
    container_name: pdf_platform_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pdf_platform_db_data:/var/lib/postgresql/data

  odoo:
    build: .
    container_name: pdf_platform_odoo
    depends_on:
      - db
    ports:
      - "8072:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      PYTHONPATH: /opt
    volumes:
      - pdf_platform_odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./pdf_engine:/opt/pdf_engine

volumes:
  pdf_platform_db_data:
  pdf_platform_odoo_data:
